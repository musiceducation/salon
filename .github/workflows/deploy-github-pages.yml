# Static marketing site only: /api, /admin, and proxy are omitted (Next.js static export cannot host them).
# Full app with booking, checkout, and DB: deploy to Vercel or another Node host instead.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

# Opt in to Node 24 for JS-based actions (see GitHub deprecation of Node 20 action runtime, ~2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Prepare static export (GitHub Pages cannot run API routes or proxy)
        run: |
          rm -f src/middleware.ts src/proxy.ts
          rm -rf src/app/api
          rm -rf src/app/admin

      - name: Build
        env:
          STATIC_EXPORT: "1"
          # Public site URL (custom domain, no path prefix). Set in repo Settings → Pages → Custom domain to match.
          NEXT_PUBLIC_SITE_URL: https://www.nnsalon.com
          NEXT_PUBLIC_INSTAGRAM_URL: https://www.instagram.com/n_nsalon/
          NEXT_PUBLIC_MPAY_ACCOUNT: "888537230267756"
          NEXT_PUBLIC_BOC_ACCOUNT: "澳門儲蓄戶 181301100827421"
          NEXT_PUBLIC_GOOGLE_APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbwWhRHKou2SYI3OlrOvWYcf_oZIwI9UOxKaKdxbI82C6mn4KUQOsr_gDab5_N6ws-efUA/exec
          # Optional: repo Settings → Secrets → GOOGLE_SITE_VERIFICATION (Search Console HTML-tag token)
          GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
          DATABASE_URL: postgresql://build:build@127.0.0.1:1/build
        run: npm run build

      - name: Disable Jekyll (ensures _next and other assets are served as-is)
        run: touch out/.nojekyll

      - name: Custom domain for GitHub Pages
        run: echo 'www.nnsalon.com' > out/CNAME

      - name: Promote Chinese locale to site root (no /zh-HK in public URLs)
        run: |
          set -euo pipefail
          ls -la out | head -40
          test -f out/zh-HK/index.html
          cp out/zh-HK/index.html out/index.html
          mkdir -p out/products
          if [ -d out/zh-HK/products ]; then
            cp -R out/zh-HK/products/. out/products/
          fi
          python3 <<'PY'
          from pathlib import Path

          Path("out/zh-HK/index.html").write_text(
              """<!DOCTYPE html>
          <html lang="zh-HK">
          <head>
          <meta charset="utf-8" />
          <meta http-equiv="refresh" content="0; url=/" />
          <link rel="canonical" href="https://www.nnsalon.com/" />
          <title>藝能美髮培訓中心 | n_nsalon</title>
          </head>
          <body><p>Redirecting to <a href="/">www.nnsalon.com</a>…</p></body>
          </html>
          """,
              encoding="utf-8",
          )
          products = Path("out/zh-HK/products/index.html")
          if products.is_file():
              products.write_text(
                  """<!DOCTYPE html>
          <html lang="zh-HK">
          <head>
          <meta charset="utf-8" />
          <meta http-equiv="refresh" content="0; url=/products/" />
          <link rel="canonical" href="https://www.nnsalon.com/products/" />
          <title>產品 | n_nsalon</title>
          </head>
          <body><p>Redirecting to <a href="/products/">products</a>…</p></body>
          </html>
          """,
                  encoding="utf-8",
              )
          print("promoted default locale to / and /products/")
          PY

      - name: Verify static output
        run: test -f out/index.html && test -d out/_next && ! grep -q 'url=./zh-HK' out/index.html && ls -la out | head -20

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
